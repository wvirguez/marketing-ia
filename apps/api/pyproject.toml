[project]
name = "impulso-api"
version = "0.1.0"
description = "Impulso backend API — FastAPI + PostgreSQL persistence + authentication/tenancy foundation (BACKEND-02/03/04). No Campaigns, no AI execution in this stage."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1.13,<2",
    "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a real, reachable, test-scoped PostgreSQL database (see tests/dbtest.py); skipped automatically when one is not configured.",
]
